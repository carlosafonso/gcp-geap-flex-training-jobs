[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geap-flex-training"
version = "0.1.0"
description = "Multi-region GPU training launcher for Google Cloud GEAP using Dynamic Workload Scheduler (Flex-Start)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-cloud-aiplatform>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
geap-flex-train = "launch_flex_train:main"
